server:
  port: 8081

spring:
  application:
    name: incident-service
  datasource:
    url: jdbc:postgresql://localhost:5432/h8?currentSchema=incident
    username: h8
    password: ${PG_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    schemas: incident
    locations: classpath:db/migration/incident
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: incident-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.h8.ems.contracts.*
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/h8

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
