server:
  port: 8085

spring:
  application:
    name: hospital-service
  datasource:
    url: jdbc:postgresql://localhost:5432/h8?currentSchema=hospital,public
    username: h8
    password: ${PG_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: hospital
    locations: classpath:db/migration/hospital
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: hospital-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.h8.ems.contracts.*
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/h8

h8:
  hospital:
    capacity-ttl-minutes: 15
    stale-penalty-seconds: 420
  routing:
    url: http://localhost:8084
    timeout-ms: 300

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
