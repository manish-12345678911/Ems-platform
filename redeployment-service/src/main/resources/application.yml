server:
  port: 8086

spring:
  application:
    name: redeployment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/h8?currentSchema=redeploy,public
    username: h8
    password: ${PG_PASSWORD:changeme_pg}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    schemas: redeploy
    locations: classpath:db/migration/redeploy
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: redeployment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.h8.ems.contracts.*
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/h8

h8:
  redeployment:
    lock-ttl-seconds: 30
    max-moves: 3
    min-coverage-gain: 0.01
    cooldown-minutes: 10
  routing:
    url: http://localhost:8084
    timeout-ms: 300

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
