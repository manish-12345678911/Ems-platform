name: h8
services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: h8
      POSTGRES_USER: h8
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U h8" ]
      interval: 5s
      retries: 10
    networks:
      - h8-net

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 10
    networks:
      - h8-net

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - h8-net

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./ops/keycloak:/opt/keycloak/data/import
    ports:
      - "8180:8080"
    networks:
      - h8-net

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - h8-net

  incident-service:
    build: ./incident-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - h8-net

  dispatch-service:
    build: ./dispatch-service
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ROUTING_URL: http://routing-service:8084
    networks:
      - h8-net

  tracking-service:
    build: ./tracking-service
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - h8-net

  routing-service:
    build: ./routing-service
    ports:
      - "8084:8084"
    volumes:
      - ./data/graph:/data/graph
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - h8-net

  hospital-service:
    build: ./hospital-service
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ROUTING_URL: http://routing-service:8084
    networks:
      - h8-net

  redeployment-service:
    build: ./redeployment-service
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ROUTING_URL: http://routing-service:8084
    networks:
      - h8-net

  audit-service:
    build: ./audit-service
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - h8-net

  web:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    networks:
      - h8-net

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - h8-net

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3000:3000"
    networks:
      - h8-net

volumes:
  pgdata: {}

networks:
  h8-net:
    driver: bridge
